name: Firmware

on:
  push:
    branches:
      - main
      - design/embodied-voice-v0
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4

      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -C firmware set-target esp32s3
          idf.py -C firmware build

      - name: Enforce application size budget
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          image = Path("firmware/build/self_involving_m3.bin")
          limit = 3_355_443  # 3.2 MiB
          size = image.stat().st_size
          print(f"Application image: {size} bytes; limit: {limit} bytes")
          if size > limit:
              raise SystemExit("Application exceeds the 3.2 MiB M0 budget")
          PY

      - name: Upload flashable images
        uses: actions/upload-artifact@v4
        with:
          name: self-involving-m3-${{ github.sha }}
          if-no-files-found: error
          path: |
            firmware/build/self_involving_m3.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/ota_data_initial.bin
            firmware/build/flash_args
